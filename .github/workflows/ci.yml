name: CI

on:
  push:
    branches: [main]
  pull_request:

# A new push to the same branch cancels the run already in flight.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    # A throwaway PostgreSQL for the persistence tests. SQLite alone hid a
    # missing column and an insert-order bug that only PostgreSQL enforces.
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: smartcattle
          POSTGRES_PASSWORD: smartcattle
          POSTGRES_DB: smartcattle_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U smartcattle -d smartcattle_test"
          --health-interval 2s --health-timeout 3s --health-retries 30
    env:
      TEST_DATABASE_URL: postgresql://smartcattle:smartcattle@localhost:5432/smartcattle_test
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          # Matches PYTHON_VERSION in render.yaml.
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Lint
        run: ruff check .

      - name: Type check
        run: mypy

      - name: Test with coverage
        # The threshold is a floor, not a target. It exists so a change that
        # adds an untested branch is visible in the diff rather than discovered
        # later; raising it is a decision, not a side effect of writing tests.
        run: pytest -q --cov=app --cov=data_structures --cov-report=term-missing --cov-fail-under=90

      - name: Migrations apply to an empty database and roll back
        # Catches a revision that only works on a database already in the
        # right shape, which is the failure mode of a Render deploy.
        run: |
          alembic upgrade head
          alembic downgrade base
        env:
          DATABASE_URL: sqlite:///ci-migrations.db

  container:
    # Builds the image and runs the whole stack from docker-compose.yml:
    # PostgreSQL, the S3 stand-in and the API. The smoke test uploads through a real
    # presigned URL and plays the AI worker, which unit tests cannot do.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Start the stack
        # Not --wait: the one-shot bucket service exits by design, and an
        # explicit health poll does not depend on how compose reads that.
        run: |
          docker compose up --build --detach api
          for attempt in $(seq 1 60); do
            curl --fail --silent http://localhost:8000/health && exit 0
            sleep 3
          done
          exit 1

      - name: Smoke test the video path
        run: |
          pip install httpx
          python -m scripts.smoke_video_upload http://localhost:8000 local-ai-key

      - name: Logs on failure
        if: failure()
        # Also raised as annotations, which stay readable on the run page
        # without opening the raw log.
        run: |
          docker compose ps --all
          docker compose logs --no-color
          for service in bucket api object-storage; do
            tail=$(docker compose logs --no-color --tail 25 "$service" 2>&1 | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
            echo "::error title=$service logs::$tail"
          done

      - name: Stop the stack
        if: always()
        run: docker compose down --volumes
